<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigate Gen — CoKit</title>
  <link rel="icon" type="image/png" href="../../assets/img/rmit-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-shell">
<div class="content-shell">
<main class="main">

  <!-- ══════════ NAVIGATE GENERATOR PANEL ══════════ -->
  <div id="panel-navgen" class="panel active">
    <div class="ng-header">
      <h2>Navigate Gen</h2>
      <p>Create styled navigation cards that link to page sections in Canvas.</p>
    </div>
    <div class="ng-bento-grid">

      <!-- Style -->
      <div class="ng-bento-card bento-card full-width">
        <div class="ng-card-label"><span class="ng-icon-badge ng-badge-navy">✦</span> Display Style</div>
        <div class="ng-style-grid" id="ng-styleGrid">
          <button class="ng-style-btn active" data-style="gradient" onclick="ngSetStyle(this)">
            <div class="ng-style-preview">
              <div class="preview-nav-card"><span class="preview-num">01</span> Section Title</div>
            </div>
            <span class="ng-style-label">Gradient</span>
          </button>
          <button class="ng-style-btn" data-style="border-left" onclick="ngSetStyle(this)">
            <div class="ng-style-preview">
              <div class="preview-nav-card"><span class="preview-num">01</span> Section Title</div>
            </div>
            <span class="ng-style-label">Border Left</span>
          </button>
          <button class="ng-style-btn" data-style="border-top" onclick="ngSetStyle(this)">
            <div class="ng-style-preview">
              <div class="preview-nav-card"><span class="preview-num">01</span> Section Title</div>
            </div>
            <span class="ng-style-label">Border Top</span>
          </button>
          <button class="ng-style-btn" data-style="minimal" onclick="ngSetStyle(this)">
            <div class="ng-style-preview">
              <div class="preview-nav-card"><span class="preview-num">01</span> Section Title</div>
            </div>
            <span class="ng-style-label">Minimal</span>
          </button>
        </div>
        <div style="margin-top:16px;">
          <div class="ng-card-label" style="margin-bottom:10px;"><span class="ng-icon-badge ng-badge-gold">●</span> Accent Color</div>
          <div class="ng-color-row">
            <div class="ng-color-swatch active" style="background:#000054;" data-color="#000054" onclick="ngSetColor(this)"></div>
            <div class="ng-color-swatch" style="background:#1a56db;" data-color="#1a56db" onclick="ngSetColor(this)"></div>
            <div class="ng-color-swatch" style="background:#0a7c59;" data-color="#0a7c59" onclick="ngSetColor(this)"></div>
            <div class="ng-color-swatch" style="background:#c0392b;" data-color="#c0392b" onclick="ngSetColor(this)"></div>
            <div class="ng-color-swatch" style="background:#7b2d8b;" data-color="#7b2d8b" onclick="ngSetColor(this)"></div>
            <div class="ng-color-swatch" style="background:#d35400;" data-color="#d35400" onclick="ngSetColor(this)"></div>
            <div class="ng-custom-color-wrap">
              <input type="color" id="ng-customColor" value="#000054" oninput="ngSetCustomColor(this)">
              <label for="ng-customColor">Custom</label>
            </div>
          </div>
        </div>
      </div>


      <!-- Sections -->
      <div class="ng-bento-card bento-card full-width">
        <div class="ng-card-label"><span class="ng-icon-badge ng-badge-navy">✎</span> Sections</div>
        <div class="ng-sections-list" id="ng-sectionsList"></div>
        <button class="ng-btn-add-section" onclick="ngAddSection()">＋ Add Section</button>
        <div class="ng-action-row">
          <button class="ng-btn-primary" onclick="ngGenerate()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Generate Canvas Code
          </button>
        </div>
      </div>

      <!-- Code Output -->
      <div class="ng-bento-card bento-card full-width">
        <div class="ng-code-output-box">
          <div class="ng-code-toolbar">
            <span>canvas-lms.html</span>
            <button class="ng-btn-copy" id="ng-copyBtn" onclick="ngCopyCode()">📋 Copy Code</button>
          </div>
          <div class="ng-code-content" id="ng-codeOutput"><!-- code will appear here after generating --></div>
        </div>
      </div>

    </div>
  </div>


</main>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
