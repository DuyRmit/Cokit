<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details Toggle — CoKit</title>
  <link rel="icon" type="image/png" href="../../assets/img/rmit-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/tool-base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-shell">
<div class="content-shell">
<main class="main">

  <!-- ══════════ DETAILS TOGGLE PANEL ══════════ -->
  <div id="panel-details" class="panel active">
    <div class="dg-header">
      <h2>Details Toggle</h2>
      <p>Build <code>&lt;details&gt;</code> toggle snippets and export clean HTML instantly.</p>
    </div>
    <div class="dg-bento-grid">

      <!-- CỘT TRÁI: Styling + Input -->
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="dg-bento-card bento-card">
          <div class="dg-card-label"><span class="dg-icon-badge dg-badge-navy">✦</span> Styling</div>
          <div class="dg-style-btns">
            <button class="dg-style-btn active" onclick="dgSetTemplate('default', this)">Default</button>
            <button class="dg-style-btn" onclick="dgSetTemplate('bordered', this)">Bordered</button>
          </div>
        </div>
        <div class="dg-bento-card bento-card">
          <div class="dg-card-label"><span class="dg-icon-badge dg-badge-gold">✎</span> Input Fields</div>
          <div class="dg-field">
            <label>Summary Text</label>
            <input type="text" id="dg-summary" class="ck-input" value="Infographic Description" oninput="dgUpdate()" placeholder="Enter summary text">
            <div class="dg-field-error" id="dg-summary-error"></div>
          </div>
          <div class="dg-field">
            <label>Description Text</label>
            <textarea id="dg-description" class="ck-textarea" rows="4" oninput="dgUpdate()" placeholder="Enter description">Enter your description here.</textarea>
          </div>
        </div>
      </div>

      <!-- CỘT PHẢI: Live Preview + Generated HTML -->
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="dg-bento-card bento-card">
          <div class="dg-card-label"><span class="dg-icon-badge dg-badge-red">◈</span> Live Preview</div>
          <div class="dg-preview-wrap" id="dg-preview"></div>
        </div>
        <div class="dg-bento-card bento-card">
          <div class="dg-code-header">
            <div class="dg-card-label" style="margin-bottom:0;"><span class="dg-icon-badge dg-badge-green">⟨/⟩</span> Generated HTML</div>
            <button class="dg-btn-copy" id="dg-copyBtn" onclick="dgCopy()">📋 Copy</button>
          </div>
          <div class="dg-code-block" id="dg-codeBlock"><span class="dg-code-empty">Fill in the fields to generate code…</span></div>
        </div>
      </div>

    </div>
    <div class="dg-toast" id="dg-toast" style="display:none;"></div>
  </div>


</main>
</div>
</div>

<script src="../../assets/js/common.js"></script>
<script src="script.js"></script>
</body>
</html>
